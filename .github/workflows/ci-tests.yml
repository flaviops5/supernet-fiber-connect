name: CI/CD - Testes Automáticos

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # 1. TESTES UNITÁRIOS
  # ==========================================
  unit-tests:
    name: 🧪 Testes Unitários
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Rodar testes
        run: npm run test
      
      - name: Gerar coverage report
        run: npm run test:coverage
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false

  # ==========================================
  # 2. LINT & TYPE CHECK
  # ==========================================
  code-quality:
    name: 🔍 Qualidade de Código
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: ESLint
        run: npm run lint
        continue-on-error: true
      
      - name: TypeScript Check
        run: npx tsc --noEmit
        continue-on-error: true

  # ==========================================
  # 3. SECURITY SCAN
  # ==========================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================
  # 4. BUILD TEST
  # ==========================================
  build:
    name: 🏗️ Build de Produção
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Verificar bundle size
        run: |
          SIZE=$(du -sh dist | cut -f1)
          echo "Bundle size: $SIZE"
          echo "bundle_size=$SIZE" >> $GITHUB_OUTPUT
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: dist/
          retention-days: 7

  # ==========================================
  # 5. LIGHTHOUSE CI (Performance)
  # ==========================================
  lighthouse:
    name: 💡 Lighthouse Performance
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Download build
        uses: actions/download-artifact@v3
        with:
          name: build
          path: dist/
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:8080
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ==========================================
  # 6. DEPENDABOT AUTO-MERGE
  # ==========================================
  dependabot:
    name: 🤖 Dependabot Auto-Merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: [unit-tests, code-quality, build]
    
    steps:
      - name: Auto-merge Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  # ==========================================
  # 7. COMENTÁRIO NO PR (com AI)
  # ==========================================
  pr-comment:
    name: 💬 PR Comment com Resumo
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [unit-tests, code-quality, security, build]
    
    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🎉 CI/CD Results
              
              ✅ Unit Tests: Passed
              ✅ Code Quality: Passed
              ✅ Security Scan: Passed
              ✅ Build: Success
              
              **Ready to merge!** 🚀`
            })
