name: E2E Tests - Playwright

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Executar diariamente às 6h UTC
    - cron: '0 6 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
      
      - name: Run E2E tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: true
          BASE_URL: ${{ secrets.STAGING_URL || 'http://localhost:8080' }}
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.browser }}
          path: coverage/playwright-results.json
          retention-days: 30
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: coverage/playwright-report/
          retention-days: 30
      
      - name: Upload videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-videos-${{ matrix.browser }}
          path: test-results/**/video.webm
          retention-days: 7
      
      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: test-results/**/screenshot.png
          retention-days: 7
  
  report:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-results-*
          path: results/
      
      - name: Generate consolidated report
        run: |
          echo "# E2E Test Results" > report.md
          echo "" >> report.md
          echo "**Coverage Target**: 90%+" >> report.md
          echo "" >> report.md
          
          # Calcular coverage total
          total_tests=$(cat results/*/playwright-results.json | jq '[.suites[].specs[]] | length' | awk '{s+=$1} END {print s}')
          passed_tests=$(cat results/*/playwright-results.json | jq '[.suites[].specs[].tests[] | select(.status=="passed")] | length' | awk '{s+=$1} END {print s}')
          coverage=$(awk "BEGIN {printf \"%.2f\", ($passed_tests / $total_tests) * 100}")
          
          echo "**Total Tests**: $total_tests" >> report.md
          echo "**Passed**: $passed_tests" >> report.md
          echo "**Coverage**: $coverage%" >> report.md
          
          if (( $(echo "$coverage >= 90" | bc -l) )); then
            echo "✅ Coverage target achieved!" >> report.md
          else
            echo "⚠️ Coverage below target (90%)" >> report.md
          fi
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
